[package]
name = "milmit-secure-desktop"
version = "0.1.2"
edition = "2021"
description = "Native Linux IKEv2 VPN and protected hotspot client"
license = "MIT"
authors = ["MilMit"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
