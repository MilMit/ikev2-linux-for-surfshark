name: MilMitVPNMobileNative
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  WireGuardKit:
    path: vendor/wireguard-apple

targets:
  PacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ../../apps/flutter/ios/PacketTunnel
        excludes:
          - Info.plist
          - PacketTunnel.entitlements
    info:
      path: ../../apps/flutter/ios/PacketTunnel/Info.plist
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.milmit.vpn.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        SWIFT_VERSION: 5.0
        CODE_SIGN_ENTITLEMENTS: ../../apps/flutter/ios/PacketTunnel/PacketTunnel.entitlements
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    preBuildScripts:
      - name: Build WireGuard Go bridge
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          WG_GO="$SRCROOT/vendor/wireguard-apple/Sources/WireGuardKitGo"
          if [ ! -d "$WG_GO" ]; then
            echo "WireGuardKitGo checkout not found at $WG_GO" >&2
            exit 1
          fi
          /usr/bin/make -C "$WG_GO"

schemes:
  PacketTunnel:
    build:
      targets:
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
