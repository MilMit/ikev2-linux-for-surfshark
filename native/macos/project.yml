name: MilMitVPNNative
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

packages:
  WireGuardKit:
    path: vendor/wireguard-apple
  OpenVPNAdapter:
    url: https://github.com/ss-abramchuk/OpenVPNAdapter.git
    revision: 33afba081c8592e8632128c7f9d6ebe53cae3d08

targets:
  PacketTunnel:
    type: app-extension
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: PacketTunnel
        excludes:
          - Info.plist
          - PacketTunnel.entitlements
    info:
      path: PacketTunnel/Info.plist
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.milmit.vpn.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        SWIFT_VERSION: 5.0
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    preBuildScripts:
      - name: Build WireGuard Go bridge
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          WG_GO="$SRCROOT/vendor/wireguard-apple/Sources/WireGuardKitGo"
          if [ ! -d "$WG_GO" ]; then
            echo "WireGuardKitGo checkout not found at $WG_GO" >&2
            exit 1
          fi
          /usr/bin/make -C "$WG_GO"

  OpenVPNPacketTunnel:
    type: app-extension
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: OpenVPNPacketTunnel
        excludes:
          - Info.plist
          - OpenVPNPacketTunnel.entitlements
    info:
      path: OpenVPNPacketTunnel/Info.plist
    dependencies:
      - package: OpenVPNAdapter
        product: OpenVPNAdapter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.milmit.vpn.OpenVPNPacketTunnel
        PRODUCT_NAME: OpenVPNPacketTunnel
        SWIFT_VERSION: 5.0
        CODE_SIGN_ENTITLEMENTS: OpenVPNPacketTunnel/OpenVPNPacketTunnel.entitlements
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        CLANG_CXX_LANGUAGE_STANDARD: gnu++14
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

schemes:
  PacketTunnel:
    build:
      targets:
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
  OpenVPNPacketTunnel:
    build:
      targets:
        OpenVPNPacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
