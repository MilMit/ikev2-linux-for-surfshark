name: Desktop platform adapters

on:
  workflow_dispatch:
  push:
    branches:
      - phase-1-flutter-foundation
      - phase-6-protocol-parity
    paths:
      - 'apps/flutter/**'
      - 'packages/milmit_vpn_macos/**'
      - 'crates/core/**'
      - 'crates/flutter-ffi/**'
      - 'crates/platform-windows/**'
      - 'crates/platform-macos/**'
      - 'native/windows/**'
      - 'native/macos/**'
      - 'packaging/windows/**'
      - 'scripts/package-flutter-windows.ps1'
      - 'scripts/package-flutter-macos.sh'
      - 'scripts/build-macos-packet-tunnel.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-platforms.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - 'packages/milmit_vpn_macos/**'
      - 'crates/core/**'
      - 'crates/flutter-ffi/**'
      - 'crates/platform-windows/**'
      - 'crates/platform-macos/**'
      - 'native/windows/**'
      - 'native/macos/**'
      - 'packaging/windows/**'
      - 'scripts/package-flutter-windows.ps1'
      - 'scripts/package-flutter-macos.sh'
      - 'scripts/build-macos-packet-tunnel.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile WFP kill-switch helper
        shell: cmd
        run: cl /nologo /O2 /W4 /DUNICODE /D_UNICODE native\windows\wfp-helper\wfp_helper.c /Fe:native\windows\wfp-helper\wfp-helper.exe /link Fwpuclnt.lib Rpcrt4.lib Ws2_32.lib
      - name: Check Windows adapter
        run: cargo check -p milmit-vpn-platform-windows
      - name: Check Windows privileged service
        run: cargo check --manifest-path native/windows/service/Cargo.toml
      - name: Test core
        run: cargo test -p surfshark-ikev2-core
      - name: Check Flutter FFI on Windows
        run: cargo check -p milmit-vpn-flutter-ffi

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build tools
        run: brew install xcodegen go
      - name: Check macOS adapter
        run: cargo check -p milmit-vpn-platform-macos
      - name: Test core
        run: cargo test -p surfshark-ikev2-core
      - name: Check Flutter FFI on macOS
        run: cargo check -p milmit-vpn-flutter-ffi
      - name: Build WireGuard and OpenVPN NetworkExtensions
        run: bash scripts/build-macos-packet-tunnel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: milmit-vpn-macos-network-extensions
          if-no-files-found: error
          path: |
            native/macos/out/PacketTunnel.appex
            native/macos/out/OpenVPNPacketTunnel.appex
