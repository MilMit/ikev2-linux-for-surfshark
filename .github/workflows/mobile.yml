name: Mobile platforms

on:
  workflow_dispatch:
  push:
    branches:
      - phase-5-mobile
      - phase-6-protocol-parity
    paths:
      - 'apps/flutter/**'
      - 'native/ios/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - 'native/ios/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/mobile.yml'

jobs:
  source-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          NAME="milmit-vpn-${GITHUB_REF_NAME//\//-}.zip"
          git archive --format=zip --output="dist/$NAME" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: milmit-vpn-source
          if-no-files-found: error
          path: dist/*.zip

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold and overlay mobile adapter
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM="$RUNNER_TEMP/android-custom"
          cp -R apps/flutter/android "$CUSTOM"
          rm -rf apps/flutter/android
          cd apps/flutter
          flutter create --platforms=android --org net.milmit --project-name milmit_vpn_client .
          cd ../..
          rm -rf apps/flutter/android/app/src/main/kotlin
          cp -R "$CUSTOM/app/src/main/kotlin" apps/flutter/android/app/src/main/
          cp "$CUSTOM/app/src/main/AndroidManifest.xml" apps/flutter/android/app/src/main/AndroidManifest.xml
          cp "$CUSTOM/app/build.gradle.kts" apps/flutter/android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/flutter/android/settings.gradle.kts')
          text = p.read_text()
          marker = 'repositories {\n        google()\n        mavenCentral()'
          if 'https://jitpack.io' not in text and marker in text:
              text = text.replace(marker, marker + '\n        maven { url = uri("https://jitpack.io") }', 1)
          p.write_text(text)
          PY
          rm -f apps/flutter/test/widget_test.dart
      - name: Flutter analyze
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build Android APK
        working-directory: apps/flutter
        run: flutter build apk --debug
      - name: Build Android App Bundle
        working-directory: apps/flutter
        run: flutter build appbundle --debug
      - uses: actions/upload-artifact@v4
        with:
          name: milmit-vpn-android-debug
          if-no-files-found: error
          path: |
            apps/flutter/build/app/outputs/flutter-apk/app-debug.apk
            apps/flutter/build/app/outputs/bundle/debug/app-debug.aab

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install native build tools
        run: brew install xcodegen go
      - name: Generate iOS Flutter scaffold and overlay native bridges
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM="$RUNNER_TEMP/ios-custom"
          cp -R apps/flutter/ios "$CUSTOM"
          rm -rf apps/flutter/ios
          cd apps/flutter
          flutter create --platforms=ios --org net.milmit --project-name milmit_vpn_client .
          cd ../..
          cp "$CUSTOM/Runner/AppDelegate.swift" apps/flutter/ios/Runner/AppDelegate.swift
          printf '\n' >> apps/flutter/ios/Runner/AppDelegate.swift
          cat "$CUSTOM/Runner/MobileCredentialStore.swift" >> apps/flutter/ios/Runner/AppDelegate.swift
          cp "$CUSTOM/Runner/Runner.entitlements" apps/flutter/ios/Runner/Runner.entitlements
          mkdir -p apps/flutter/ios/PacketTunnel apps/flutter/ios/OpenVPNPacketTunnel
          cp -R "$CUSTOM/PacketTunnel/." apps/flutter/ios/PacketTunnel/
          cp -R "$CUSTOM/OpenVPNPacketTunnel/." apps/flutter/ios/OpenVPNPacketTunnel/
          rm -f apps/flutter/test/widget_test.dart
      - name: Build Flutter iOS app without signing
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign
      - name: Prepare pinned WireGuardKit checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/ios/vendor
          git clone --filter=blob:none https://github.com/WireGuard/wireguard-apple.git native/ios/vendor/wireguard-apple
          git -C native/ios/vendor/wireguard-apple checkout 2fec12a6e1f6e3460b6ee483aa00ad29cddadab1
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/ios/vendor/wireguard-apple/Package.swift')
          text = p.read_text()
          if text.startswith('// swift-tools-version:5.3'):
              text = text.replace('// swift-tools-version:5.3', '// swift-tools-version:5.5', 1)
              p.write_text(text)
          elif not text.startswith('// swift-tools-version:5.5'):
              raise SystemExit('unexpected WireGuardKit Package.swift header')
          PY
      - name: Generate PacketTunnel projects
        working-directory: native/ios
        run: xcodegen generate
      - name: Build WireGuard PacketTunnel without signing
        working-directory: native/ios
        run: |
          xcodebuild \
            -project MilMitVPNMobileNative.xcodeproj \
            -scheme PacketTunnel \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Build OpenVPN PacketTunnel without signing
        working-directory: native/ios
        run: |
          xcodebuild \
            -project MilMitVPNMobileNative.xcodeproj \
            -scheme OpenVPNPacketTunnel \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Collect PacketTunnel extensions
        shell: bash
        run: |
          set -euo pipefail
          WG_APPEX="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*PacketTunnel.appex' ! -path '*OpenVPNPacketTunnel.appex' -type d -print -quit)"
          OVPN_APPEX="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*OpenVPNPacketTunnel.appex' -type d -print -quit)"
          test -n "$WG_APPEX"
          test -n "$OVPN_APPEX"
          rm -rf native/ios/out
          mkdir -p native/ios/out
          cp -R "$WG_APPEX" native/ios/out/PacketTunnel.appex
          cp -R "$OVPN_APPEX" native/ios/out/OpenVPNPacketTunnel.appex
      - uses: actions/upload-artifact@v4
        with:
          name: milmit-vpn-ios-nosign-debug
          if-no-files-found: error
          path: |
            apps/flutter/build/ios/iphoneos/Runner.app
            native/ios/out/PacketTunnel.appex
            native/ios/out/OpenVPNPacketTunnel.appex
