[package]
name = "milmit-vpn-flutter-ffi"
version = "0.7.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
surfshark-ikev2-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
milmit-vpn-platform-linux = { path = "../platform-linux" }

[target.'cfg(target_os = "windows")'.dependencies]
milmit-vpn-platform-windows = { path = "../platform-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
milmit-vpn-platform-macos = { path = "../platform-macos" }
