name: milmit_vpn_macos
description: Native macOS NetworkExtension bridge for MilMit VPN.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MilMitVpnMacosPlugin
